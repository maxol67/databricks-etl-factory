# Runs bronze_crm_etl automatically whenever a new file lands in the System Drop volume
# under the CRM's own top-level folder. Single-task job, not folded into a bigger job,
# because Tier 1 pipelines are independent per source (see bronze_crm_etl.pipeline.yml) -
# a CRM file arrival has nothing to do with Finance's own delivery schedule, so it
# shouldn't re-run bronze_finance_etl too (a bigger job with both as tasks would, since a
# trigger fires the whole job's task graph, not a single task within it).
#
# Prefixed trigger_ (not bronze_) for the same reason refresh_ jobs are prefixed: the
# Databricks Jobs list is flat, no folders, so the prefix is what groups all trigger jobs
# together at a glance - and distinguishes this file-arrival-triggered job from the
# bronze_crm_etl PIPELINE it runs (same base name, different resource type/namespace).
#
# Downstream: this only refreshes Bronze. See
# trigger_silver_gold/trigger_silver_gold_customers.job.yml for how Silver/Gold pick up the
# change automatically via their own table_update trigger.

resources:
  jobs:
    trigger_bronze_crm_etl:
      name: trigger_bronze_crm_etl_${bundle.target}

      trigger:
        file_arrival:
          url: "/Volumes/${var.catalog}/drop/system_drop/crm/customers/"

      tasks:
        - task_key: run_bronze_crm_etl
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_crm_etl.id}
