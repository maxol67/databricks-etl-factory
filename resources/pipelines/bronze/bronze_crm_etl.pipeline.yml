# Tier 1 (source-ingestion) pipeline for the CRM: System Drop -> Bronze only. See
# CONVENTIONS.md for the project's schema-allocation rules and README.md for the target
# architecture, the Tier 1/Tier 2 pipeline-grouping principle, and why pipelines are also
# prefixed by layer (bronze_/silver_/gold_) - the Databricks Pipelines list is flat, no
# folders, so the prefix is the only way to group by layer at a glance.
#
# Tier 1 = grouped by WHO DELIVERS the data (one pipeline per source system). Tier 2's
# silver_customers_etl/gold_shared_customers_etl own the conformed Silver/Gold customer
# representation, reading this pipeline's Bronze table cross-pipeline (joined there with
# bronze_finance_etl's credit score) - this pipeline has no knowledge of who reads it.
#
# schema: bronze below is this pipeline's own default, since Bronze is all it produces.

resources:
  pipelines:
    bronze_crm_etl:
      # Suffixed with the target name so dev/prod pipelines are distinguishable in the
      # workspace UI - both would otherwise deploy as the identical "bronze_crm_etl".
      name: bronze_crm_etl_${bundle.target}
      catalog: ${var.catalog}
      schema: bronze
      serverless: true
      continuous: false
      root_path: "../../../src/pipelines/bronze/bronze_crm_etl"

      configuration:
        bundle.catalog: ${var.catalog}
        # Read by crm_customers.py to look up its entry in config/source_environment.yml -
        # see CONVENTIONS.md's "Source registry and source x environment connection config"
        # section.
        bundle.target: ${bundle.target}
        bundle.workspace_file_path: ${workspace.file_path}

      libraries:
        - glob:
            include: ../../../src/pipelines/bronze/bronze_crm_etl/transformations/**

      environment:
        dependencies:
          - --editable ${workspace.file_path}
