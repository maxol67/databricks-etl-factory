# Tier 1 (source-ingestion) pipeline for MDM: Staging -> Bronze only. See AGENTS.md for
# the project's schema-allocation rules and README.md for the target architecture, the
# Tier 1/Tier 2 pipeline-grouping principle, and why pipelines are also prefixed by layer
# (bronze_/silver_/gold_) - the Databricks Pipelines list is flat, no folders, so the
# prefix is the only way to group by layer at a glance.
#
# Staging, not a Drop zone: MDM (Master Data Management) has no native Lakeflow Connect
# connector, so this is exactly what Staging exists for (an external cloud-native or
# on-prem ETL/orchestration tool landing raw files) - same reasoning as bronze_sap_etl.
#
# Tier 1 = grouped by WHO DELIVERS the data (one pipeline per source system, since each
# system's delivery is independent). Tier 2's silver_products_etl owns the conformed
# Silver representation, reading this pipeline's Bronze table cross-pipeline - this
# pipeline has no knowledge of who reads it (including silver_sales_etl's orders tables,
# which carry a product_id reference but don't join against this pipeline's output - see
# silver_products_etl.pipeline.yml).
#
# schema: bronze below is this pipeline's own default, since Bronze is all it produces.

resources:
  pipelines:
    bronze_mdm_etl:
      # Suffixed with the target name so dev/prod pipelines are distinguishable in the
      # workspace UI - both would otherwise deploy as the identical "bronze_mdm_etl".
      name: bronze_mdm_etl_${bundle.target}
      catalog: ${var.catalog}
      schema: bronze
      serverless: true
      continuous: false
      root_path: "../../../src/pipelines/bronze/bronze_mdm_etl"

      configuration:
        bundle.catalog: ${var.catalog}
        # Read by mdm_products.py to look up its entry in config/source_environment.yml -
        # see CONVENTIONS.md's "Source registry and Source x Environment connection config"
        # section.
        bundle.target: ${bundle.target}
        bundle.workspace_file_path: ${workspace.file_path}

      libraries:
        - glob:
            include: ../../../src/pipelines/bronze/bronze_mdm_etl/transformations/**

      environment:
        dependencies:
          - --editable ${workspace.file_path}
