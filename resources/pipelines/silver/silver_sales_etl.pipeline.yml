# Tier 2 (business-domain) pipeline for Sales: Bronze (cross-pipeline) -> Silver. See
# CONVENTIONS.md for the project's schema-allocation rules and README.md for the target
# architecture, the Tier 1/Tier 2 pipeline-grouping principle, and why pipelines are also
# prefixed by layer (bronze_/silver_/gold_) - the Databricks Pipelines list is flat, no
# folders, so the prefix is the only way to group by layer at a glance.
#
# Tier 2 = grouped by WHICH BUSINESS DOMAIN consumes the data, not by source. Reads
# bronze_sap_etl's and bronze_webshop_etl's Bronze tables cross-pipeline (plain
# batch/stream table reads by fully-qualified name, the same pattern
# silver_customers_etl/gold_shared_customers_etl use for their own cross-pipeline reads) and
# lands each as its own validated Silver table - sap_orders and webshop_orders are kept
# SEPARATE for now (no unified `orders` yet): that needs a fan-in
# (dp.create_streaming_table + one @dp.append_flow per source, Lakeflow's documented
# alternative to UNION), deliberately deferred - see BACKLOG.md.
#
# Gold now exists too, as its own gold_sales_etl pipeline (schema: gold_sales) - see that
# pipeline's own comment. It reads sap_orders/webshop_orders separately and unifies them into
# ONE fact_orders itself, rather than waiting on the Silver-level union above - see
# fact_orders.py's own docstring for why that's the right place for the fan-in to finally
# happen.
#
# schema: silver_sales below is this pipeline's own default, since Silver is all it
# currently produces (no Bronze of its own - see above).
#
# Also writes silver_data_quality.sap_orders_findings and silver_data_quality.webshop_orders_findings
# (fully-qualified, outside this pipeline's own default schema) - rows that fail a check: rejected
# rows are excluded from the tables above and warning rows still merge into them, but both land
# here, kept for manual review instead of only a metrics count. See sap_orders.py's docstring and
# CONVENTIONS.md's Schema allocation rule.

resources:
  pipelines:
    silver_sales_etl:
      # Suffixed with the target name so dev/prod pipelines are distinguishable in the
      # workspace UI - both would otherwise deploy as the identical "silver_sales_etl".
      name: silver_sales_etl_${bundle.target}
      catalog: ${var.catalog}
      schema: silver_sales
      serverless: true
      continuous: false
      root_path: "../../../src/pipelines/silver/silver_sales_etl"

      configuration:
        bundle.catalog: ${var.catalog}

      libraries:
        - glob:
            include: ../../../src/pipelines/silver/silver_sales_etl/transformations/**

      environment:
        dependencies:
          - --editable ${workspace.file_path}
