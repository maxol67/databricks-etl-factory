# Tier 2 (business-domain) pipeline for Products: Bronze (cross-pipeline) -> Silver only.
# See CONVENTIONS.md for the project's schema-allocation rules and README.md for the target
# architecture, the Tier 1/Tier 2 pipeline-grouping principle, and why pipelines are also
# prefixed by layer (bronze_/silver_/gold_) - the Databricks Pipelines list is flat, no
# folders, so the prefix is the only way to group by layer at a glance.
#
# Tier 2 = grouped by WHICH BUSINESS DOMAIN consumes the data, not by source. Reads
# bronze_mdm_etl's AND bronze_prodman_etl's Bronze tables cross-pipeline (plain batch/stream
# table reads by fully-qualified name) and JOINS them (not a fan-in/union like
# silver_sales_etl's separate order sources - these are different attributes of the same
# product, not more rows) into one silver_products.products - see that pipeline's own
# products.py docstring for why it deliberately keeps full history rather than deduplicating,
# same reasoning as silver_customers_etl's customers.py.
#
# schema: silver_products below is this pipeline's own default, since Silver is all it
# currently produces (no Bronze of its own - see above). "Products" is its own schema, a
# genuinely different subject area from silver_sales/silver_customers, not folded into
# either - per CONVENTIONS.md's Schema allocation rule.
#
# Also writes silver_data_quality.mdm_products_findings and
# silver_data_quality.prodman_product_pricing_findings (fully-qualified, outside this
# pipeline's own default schema) - rows that fail a check: rejected rows are excluded from
# `products` above and warning rows still merge into it, but both land here, kept for manual
# review instead of only a metrics count. See products.py's docstring and CONVENTIONS.md's
# Schema allocation rule.
#
# Deliberately does NOT join into silver_sales_etl's order tables: silver_sales.sap_orders/
# webshop_orders carry a plain product_id reference column (validated/cast, same treatment
# customer_id already gets there), not a denormalized product join. Order<->product is a
# genuine fact<->dimension relationship (Kimball sense), which belongs at Gold - see
# gold_sales_etl.pipeline.yml/fact_orders.py for where that join actually happens now.

resources:
  pipelines:
    silver_products_etl:
      # Suffixed with the target name so dev/prod pipelines are distinguishable in the
      # workspace UI - both would otherwise deploy as the identical "silver_products_etl".
      name: silver_products_etl_${bundle.target}
      catalog: ${var.catalog}
      schema: silver_products
      serverless: true
      continuous: false
      root_path: "../../../src/pipelines/silver/silver_products_etl"

      configuration:
        bundle.catalog: ${var.catalog}

      libraries:
        - glob:
            include: ../../../src/pipelines/silver/silver_products_etl/transformations/**

      environment:
        dependencies:
          - --editable ${workspace.file_path}
