# Source x environment connection config: what genuinely varies by environment for each source
# in config/sources.yml. See CONVENTIONS.md's "Source registry and source x environment
# connection config" section for the design rationale and how pipeline code reads this file.
#
# `{catalog}` is a literal placeholder, filled in by pipeline code from `bundle.catalog` at
# runtime (Python's str.format) - not a DAB substitution.
#
# dev and prod happen to resolve to the same relative path for every source today - the point is
# this is now looked up, not hardcoded, so a future environment that genuinely differs (or a
# future native-connector source needing real host/credentials) needs a config change here, not
# a code change.
sap:
  dev:
    staging_path: "/Volumes/{catalog}/staging/staging/sap/orders/"
    schema_location: "/Volumes/{catalog}/staging/staging/_schemas/sap_orders_bronze/"
  prod:
    staging_path: "/Volumes/{catalog}/staging/staging/sap/orders/"
    schema_location: "/Volumes/{catalog}/staging/staging/_schemas/sap_orders_bronze/"

